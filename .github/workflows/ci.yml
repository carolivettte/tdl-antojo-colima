name: Integración continua

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Linter (ruff)
        run: ruff check .
      - name: Pruebas con cobertura mínima de 80% en el pipeline
        run: pytest -q --cov=pipeline --cov-report=term-missing --cov-fail-under=80
      - name: Puerta de calidad sobre los datos del repositorio
        # Corre bronce -> plata -> oro y falla si algún origen queda por debajo de 98% de validez
        # (objetivo de calidad 3).
        run: python -m pipeline.ejecutar --verificar
      - name: Respaldo de bronce restaurable
        run: python -m scripts.respaldo
      - name: Vulnerabilidades en dependencias (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Secretos expuestos (gitleaks)
        # Defecto 10: la descarga de gitleaks fallaba con HTTP 504. Se intenta desde tres
        # orígenes oficiales; si encuentra un secreto, el paso falla (código de salida 1).
        run: |
          VERSION=8.24.3
          OPCIONES="git --redact --verbose"
          if curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o gitleaks.tar.gz \
              "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"; then
            tar -xzf gitleaks.tar.gz gitleaks
            ./gitleaks $OPCIONES .
          else
            echo "Descarga directa falló; uso la imagen oficial de contenedor"
            DOCKER="docker run --rm -v $PWD:/repo -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=*"
            $DOCKER ghcr.io/gitleaks/gitleaks:v${VERSION} $OPCIONES /repo \
              || $DOCKER zricethezav/gitleaks:v${VERSION} $OPCIONES /repo
          fi
