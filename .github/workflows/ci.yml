name: Integración continua

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Linter (ruff)
        run: ruff check .
      - name: Pruebas (pytest)
        run: pytest -q
      - name: Secretos expuestos (gitleaks)
        # Se instala directo desde el repositorio oficial con reintentos: la acción
        # gitleaks-action fallaba al descargar (HTTP 504, defecto 10 de Carol).
        run: |
          curl -sSfL --retry 5 --retry-delay 10 --retry-all-errors -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .
